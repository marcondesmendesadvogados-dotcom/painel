<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel da Operação</title>
<style>html,body{margin:0;background:#07090d;color:#a9b1c4;font:14px Inter,"Segoe UI",system-ui,sans-serif}#c{display:grid;place-items:center;height:100vh;text-align:center;padding:16px}</style>
</head>
<body>
<div id="c">Carregando o painel…</div>
<script>
// Esta página só carrega o painel do servidor do escritório (Google Apps Script).
// Nenhum dado de cliente fica aqui: os dados só vêm depois da senha.
var API = 'https://script.google.com/macros/s/AKfycbz0hCs1CENK68NuWqdLtC2LwcxJblwlRfW6cWXn72L9uXOHpGca7CWZHkklJdPv4ZPf/exec';
function falhou(){ document.getElementById('c').innerHTML = 'Não foi possível carregar o painel.<br><br><a href="" style="color:#8fc3ff">Tentar de novo</a>'; }
fetch(API, { method: 'POST', credentials: 'omit', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ painelFn: 'pagina' }) })
  .then(function(r){ return r.json(); })
  .then(function(j){
    if (!j || !j.r) return falhou();
    var h = j.r.replace('<script>', '<script>window.API_URL=' + JSON.stringify(API) + ';</' + 'script><script>');
    document.open(); document.write(h); document.close();
  })
  .catch(falhou);
</script>
</body>
</html>
